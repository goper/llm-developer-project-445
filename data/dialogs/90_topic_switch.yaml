# Свой сценарий: смена темы при живой карточке — карточка живёт, «да» исполняет,
# повторное «да» не исполняет второй раз.
name: 90_topic_switch
user: anna
turns:
  - say: переведи меня на семейный
    expect: { plan_has: [tariff], card: true }
  - say: а что входит в семейный тариф?
    expect: { card: false, state: { tariff: Базовый } }
